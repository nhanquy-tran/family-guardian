name: "Factory 2: spec approved"

# A merged `spec` PR is the human spec approval. Move the issue to `ready`.

on:
  pull_request:
    types: [closed]

permissions:
  issues: write

jobs:
  ready:
    if: github.event.pull_request.merged && contains(github.event.pull_request.labels.*.name, 'spec')
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      BRANCH: ${{ github.event.pull_request.head.ref }}
    steps:
      - run: |
          ISSUE="${BRANCH#spec/}"
          gh issue edit "$ISSUE" --repo "${{ github.repository }}" --remove-label spec-review --add-label ready
