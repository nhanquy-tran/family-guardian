name: "Factory 1: write spec"
run-name: "Factory 1: write spec #${{ inputs.issue }}"

# Needs features.spec_in_actions: true in .factory/config.yml. Dispatched by the router (needs-spec) or the
# scheduler (autopilot issues). Keep the ref and factory_ref equal; bump both together.
on:
  workflow_dispatch:
    inputs:
      issue:
        description: Issue number
        required: true

concurrency:
  group: factory-spec-${{ inputs.issue }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  spec:
    uses: nhanquy-tran/ai-factory/.github/workflows/spec.yml@v1
    with:
      issue: ${{ inputs.issue }}
      factory_ref: v1
    secrets: inherit
