name: "Factory 1: write spec"
run-name: "Factory 1: write spec #${{ inputs.issue }}"

# Trigger: dispatched by the router when the owner labels an issue `needs-spec`. Dispatch requires write access.
# Output: a PR labelled `spec` with an OpenSpec change. Merging it is the human spec approval (gate 1).

on:
  workflow_dispatch:
    inputs:
      issue:
        description: Issue number
        required: true

concurrency:
  group: factory-spec-${{ inputs.issue }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  spec:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ISSUE: ${{ inputs.issue }}
      MODE: ${{ vars.FACTORY_MODE || 'full' }}
      GH_TOKEN: ${{ secrets.FACTORY_TOKEN || github.token }}
    steps:
      - uses: actions/checkout@v5
        with:
          token: ${{ secrets.FACTORY_TOKEN || github.token }}
      - uses: ./.github/actions/setup
      - name: Factory mode
        # A `full-mode` label on the issue overrides light mode for this issue (ADR 0018).
        run: |
          M="$MODE"
          LABELS=$(gh issue view "$ISSUE" --json labels -q '[.labels[].name] | join(",")')
          # The risk tier (ADR 0022) reads the issue labels; the spec writer's own eval run sees them too.
          echo "ISSUE_LABELS=$LABELS" >> "$GITHUB_ENV"
          if echo ",$LABELS," | grep -q ',full-mode,'; then M=full; echo "MODE=full" >> "$GITHUB_ENV"; fi
          echo "Factory mode: $M" >> "$GITHUB_STEP_SUMMARY"
      - name: Branch
        run: |
          git config user.name "family-guardian-factory"
          git config user.email "factory@users.noreply.github.com"
          git checkout -b "spec/${ISSUE}"
          gh issue edit "$ISSUE" --remove-label needs-spec --add-label spec-in-progress
      - name: Spec writer agent
        id: agent
        timeout-minutes: 12
        # A timeout or action error must not discard a finished spec; the spec eval decides.
        continue-on-error: true
        uses: anthropics/claude-code-action@v1
        env:
          GH_TOKEN: ${{ github.token }} # read-only use (gh issue view); never the owner PAT (ADR 0017)
        with:
          anthropic_api_key: ${{ secrets.CLAUDE_API_KEY }}
          allowed_bots: github-actions # the router dispatches as github-actions
          github_token: ${{ github.token }}
          prompt: |
            Follow .claude/agents/spec-writer.md exactly. Factory mode: ${{ env.MODE }}.
            Repository: ${{ github.repository }}. Issue number: ${{ env.ISSUE }}.
          claude_args: |
            --model ${{ vars.FACTORY_SPEC_MODEL || 'claude-sonnet-5-5' }}
            --permission-mode default
            --allowedTools "Read,Write,Edit,Glob,Grep,Bash(cd:*),Bash(gh issue view:*),Bash(npx openspec:*),Bash(openspec:*),Bash(ls:*),Bash(node .github/scripts/factory-eval.mjs:*)"
      - name: Metrics (spec-writer)
        if: always()
        continue-on-error: true
        env:
          EXEC_FILE: ${{ steps.agent.outputs.execution_file }}
        run: bash .github/scripts/post-metrics.sh spec-writer "$ISSUE" "$EXEC_FILE"
      - name: Commit and open PR
        id: pr
        run: |
          git checkout -B "spec/${ISSUE}"
          git add -A openspec docs/decisions
          if git diff --cached --quiet; then
            gh issue comment "$ISSUE" --body "Factory: the spec writer produced no change. Needs a human look."
            gh issue edit "$ISSUE" --remove-label spec-in-progress --add-label needs-human
            exit 1
          fi
          TITLE=$(gh issue view "$ISSUE" --json title -q .title)
          git commit -m "spec: ${TITLE} (#${ISSUE})"
          git push -u origin "spec/${ISSUE}"
          # Deterministic spec eval (structure, scenarios, openspec validate --strict); the result goes in the PR evidence.
          CHANGE=$(git diff --name-only HEAD~1 -- openspec/changes | sed -n 's#^openspec/changes/\([^/]*\)/.*#\1#p' | grep -v '^archive$' | head -1 || true)
          SPEC_EVAL="fail (no change folder)"
          if [ -n "$CHANGE" ]; then
            ADDS_ADR=0
            git diff --name-only --diff-filter=A HEAD~1 -- docs/decisions | grep -q '/[0-9]\{4\}-' && ADDS_ADR=1
            ADDS_ADR=$ADDS_ADR GITHUB_OUTPUT=/tmp/spec-eval.out node .github/scripts/factory-eval.mjs spec "$CHANGE" > /tmp/spec-eval.md 2>/dev/null || true
            SPEC_EVAL=$(sed -n 's/^result=//p' /tmp/spec-eval.out 2>/dev/null || true)
          fi
          RISK=$(sed -n 's/^risk=//p' /tmp/spec-eval.out 2>/dev/null || true)
          RISK_WHY=$(sed -n 's/^- risk: high (\(.*\)): design template.*/\1/p' /tmp/spec-eval.md 2>/dev/null || true)
          LABELS="spec"
          case "$SPEC_EVAL" in pass*) ;; *) LABELS="spec,needs-human" ;; esac
          if [ "$RISK" = "high" ]; then
            gh label create risk-high --color B60205 --description "Risk tier high: design template and architect review (ADR 0022)" >/dev/null 2>&1 || true
            LABELS="$LABELS,risk-high"
          fi
          {
            echo "Spec for #${ISSUE}."
            echo
            echo "Review the proposal and scenarios. **Merging this PR approves the spec** and moves the issue to \`ready\` for the nightly build."
            echo
            echo "## Evidence"
            echo "| Gate | Result |"
            echo "|---|---|"
            echo "| Spec eval: structure, GIVEN/WHEN/THEN, test files named, \`openspec validate --strict\` | ${SPEC_EVAL:-not run} |"
            if [ "$MODE" = "light" ]; then echo "| AI review | none in light mode: Claude's spec gate reviews (ADR 0018) |"; else echo "| AI review | posted as a comment, verdict also in the \`factory/review\` status |"; fi
            if [ "$RISK" = "high" ]; then echo "| Risk tier | high: ${RISK_WHY}. Architect review follows as a comment (ADR 0022) |"; else echo "| Risk tier | ${RISK:-not run}: no architect review |"; fi
            echo
            cat /tmp/spec-eval.md 2>/dev/null || true
            if git diff --name-only HEAD~1 | grep -q QUESTIONS.md; then
              echo
              echo "**The agent has open questions** in \`QUESTIONS.md\`. Answer on the issue, close this PR and label the issue \`needs-spec\` again."
            fi
          } > /tmp/body.md
          URL=$(gh pr create --title "spec: ${TITLE} (#${ISSUE})" --body-file /tmp/body.md --label "$LABELS" --base main)
          gh issue edit "$ISSUE" --remove-label spec-in-progress --add-label spec-review
          {
            echo "number=${URL##*/}"
            echo "risk=${RISK:-normal}"
            echo "why=${RISK_WHY}"
          } >> "$GITHUB_OUTPUT"
      - name: Architect agent
        id: architect
        if: steps.pr.outputs.risk == 'high'
        timeout-minutes: 10
        # Advisory: the spec gate reads the verdict; a failed review must not block the spec PR.
        continue-on-error: true
        uses: anthropics/claude-code-action@v1
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          anthropic_api_key: ${{ secrets.CLAUDE_API_KEY }}
          allowed_bots: github-actions
          github_token: ${{ github.token }}
          prompt: |
            Follow .claude/agents/architect.md exactly.
            Repository: ${{ github.repository }}. Spec PR number: ${{ steps.pr.outputs.number }}. Issue number: ${{ env.ISSUE }}.
            Risk reasons: ${{ steps.pr.outputs.why }}.
          claude_args: |
            --model ${{ vars.FACTORY_ARCHITECT_MODEL || 'claude-opus-5-5' }}
            --permission-mode default
            --allowedTools "Read,Glob,Grep,Bash(cd:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh pr list:*),Bash(gh pr comment:*),Bash(gh issue view:*),Bash(git diff:*),Bash(git log:*),Bash(git show:*),Bash(ls:*)"
      - name: Architect verdict
        if: always() && steps.architect.outcome != 'skipped'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ steps.pr.outputs.number }}
        run: |
          V=$(gh api "repos/${GITHUB_REPOSITORY}/issues/${PR}/comments?per_page=100" --jq '[.[] | select(.body | test("factory-architect"))] | last | .body // ""' | grep -o '"verdict":"[a-z-]*"' | tail -1 | cut -d'"' -f4)
          gh label create architect-changes-needed --color D93F0B --description "Architect review asked for design changes (ADR 0022)" >/dev/null 2>&1 || true
          if [ "$V" = "changes-needed" ]; then gh pr edit "$PR" --add-label architect-changes-needed; fi
          if [ -z "$V" ]; then gh pr comment "$PR" --body "Architecture review: the architect agent posted no verdict (timeout or error). The spec gate reviews the design itself."; fi
          echo "Architect verdict: ${V:-none}" >> "$GITHUB_STEP_SUMMARY"
      - name: Metrics (architect)
        if: always() && steps.architect.outcome != 'skipped'
        continue-on-error: true
        env:
          EXEC_FILE: ${{ steps.architect.outputs.execution_file }}
        run: bash .github/scripts/post-metrics.sh architect "$ISSUE" "$EXEC_FILE"
