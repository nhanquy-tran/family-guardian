name: E2E

# Dashboard end-to-end tests and screenshots against a local Supabase stack (ADR 0021).
on:
  schedule:
    - cron: "30 1 * * *"
  workflow_dispatch:

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  e2e:
    # Playwright 1.56 cannot install Chromium on ubuntu-latest (26.04) (#134).
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
      - name: Start local Supabase (applies supabase/migrations)
        run: npx supabase start -x studio,imgproxy,edge-runtime,logflare,vector,supavisor
      - run: npx playwright install --with-deps chromium
        working-directory: e2e
      - run: npm run e2e
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-screenshots
          path: e2e/screenshots/
          retention-days: 14
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-report
          path: e2e/playwright-report/
          retention-days: 7
      - if: always()
        run: npx supabase stop --no-backup
