name: "Factory 6: scheduler"

on:
  schedule:
    - cron: "11,41 * * * *" # off :00/:30, where GitHub delays or drops most scheduled runs
  issues:
    types: [closed, labeled] # autopilot or ready; specs for autopilot issues need features.spec_in_actions
  pull_request:
    types: [closed]
  workflow_run:
    workflows: ["Factory 3: build"]
    types: [completed]
  workflow_dispatch:
    inputs:
      dry_run:
        description: Only print what would happen
        type: boolean
        default: false

concurrency:
  group: factory-scheduler
  cancel-in-progress: false

permissions:
  contents: read
  issues: write
  actions: write

jobs:
  schedule:
    if: github.event_name != 'issues' || github.event.action == 'closed' || github.event.label.name == 'autopilot' || github.event.label.name == 'ready'
    uses: nhanquy-tran/ai-factory/.github/workflows/scheduler.yml@v1
    with:
      dry_run: ${{ inputs.dry_run || false }}
      factory_ref: v1
