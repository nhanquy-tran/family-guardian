name: "Factory 6: scheduler"

# Starts specs and builds for `autopilot` issues in dependency order (Depends on / Touches lines),
# at most FACTORY_MAX_PARALLEL agent jobs, and updates the "Factory state" issue (ADR 0017).

on:
  schedule:
    - cron: "11,41 * * * *" # off :00/:30, where GitHub delays or drops most scheduled runs
  issues:
    types: [closed, labeled]
  pull_request:
    types: [closed]
  workflow_dispatch:
    inputs:
      dry_run:
        description: Only print what would happen
        type: boolean
        default: false

concurrency:
  group: factory-scheduler
  cancel-in-progress: false

permissions:
  contents: read
  issues: write
  actions: write # revive-schedules.mjs starts workflows whose cron slot was skipped

jobs:
  schedule:
    if: >-
      github.event_name != 'issues' || github.event.action == 'closed' ||
      contains(fromJson('["autopilot","ready"]'), github.event.label.name)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Schedule
        env:
          GH_TOKEN: ${{ secrets.FACTORY_TOKEN || github.token }}
          MAX_PARALLEL: ${{ vars.FACTORY_MAX_PARALLEL || 3 }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '0' }}
        run: node .github/scripts/scheduler.mjs | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Revive missed schedules
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '0' }}
        run: node .github/scripts/revive-schedules.mjs factory-scheduler.yml | tee -a "$GITHUB_STEP_SUMMARY"
