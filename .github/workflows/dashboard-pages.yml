name: Dashboard to GitHub Pages

# Publishes the static factory control pane (tools/factory-dashboard) to GitHub Pages.
# One-time setup: Settings > Pages > Source: GitHub Actions.

on:
  push:
    branches: [main]
    paths:
      - "tools/factory-dashboard/**"
      - "docs/design/**"
      - ".github/workflows/dashboard-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/configure-pages@v6
      # Stamp the commit onto the CSS/JS links so a cached old app.js is never paired with a new index.html.
      # The design tokens and icon live in docs/design; the deployed pane always uses those.
      - run: cp docs/design/tokens.css docs/design/icon.svg tools/factory-dashboard/
      - run: sed -i "s/?v=dev/?v=${GITHUB_SHA::7}/g" tools/factory-dashboard/index.html
      - uses: actions/upload-pages-artifact@v5
        with:
          path: tools/factory-dashboard
      - id: deployment
        uses: actions/deploy-pages@v5
