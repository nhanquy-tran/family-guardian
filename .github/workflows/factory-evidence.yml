name: "Factory 8: evidence"

# Needs features.evidence: true in .factory/config.yml. Recomputes factory PR evidence and re-runs the spec
# eval on spec PRs on every later push.
on:
  pull_request:
    types: [synchronize]
    branches: [main]

concurrency:
  group: evidence-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  issues: read

jobs:
  evidence:
    if: startsWith(github.head_ref, 'factory/') || startsWith(github.head_ref, 'spec/')
    uses: nhanquy-tran/ai-factory/.github/workflows/evidence.yml@v1
    with:
      factory_ref: v1
