name: "Factory 5: watchdog"

# Needs features.watchdog: true in .factory/config.yml. Also on every push to main: that is when PRs start
# to conflict, and the cron is often delayed by hours.
on:
  push:
    branches: [main]
  schedule:
    - cron: "26,56 * * * *" # off :00/:30, where GitHub delays or drops most scheduled runs
  workflow_dispatch:

concurrency:
  group: factory-watchdog
  cancel-in-progress: false

permissions:
  contents: write
  actions: write
  issues: write
  pull-requests: write

jobs:
  watch:
    uses: nhanquy-tran/ai-factory/.github/workflows/watchdog.yml@v1
    with:
      factory_ref: v1
    secrets: inherit
