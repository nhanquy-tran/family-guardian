name: "Factory 5: watchdog"

# Every 30 minutes: restart agent runs that made no progress for 30+ minutes once older than 60 minutes
# (max 2 restarts, then needs-human), and unblock factory/spec PRs that conflict with main
# (GitHub runs no PR workflows on conflicting PRs). See docs/way-of-working.md.
# Also on every push to main: that is when PRs start to conflict, and the cron is often delayed by hours.

on:
  push:
    branches: [main]
  schedule:
    - cron: "26,56 * * * *" # off :00/:30, where GitHub delays or drops most scheduled runs
  workflow_dispatch:

concurrency:
  group: factory-watchdog
  cancel-in-progress: false

permissions:
  contents: write
  actions: write
  issues: write
  pull-requests: write

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ secrets.FACTORY_TOKEN || github.token }}
      RUN_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5
        with:
          token: ${{ secrets.FACTORY_TOKEN || github.token }}
          fetch-depth: 0
      - run: bash .github/scripts/watchdog.sh
      - name: Revive missed schedules
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: node .github/scripts/revive-schedules.mjs factory-watchdog.yml | tee -a "$GITHUB_STEP_SUMMARY"
