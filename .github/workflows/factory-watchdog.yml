name: "Factory 5: watchdog"

# Every 30 minutes: restart agent runs that made no progress for 30+ minutes once older than 60 minutes
# (max 2 restarts, then needs-human), and unblock factory/spec PRs that conflict with main
# (GitHub runs no PR workflows on conflicting PRs). See docs/way-of-working.md.

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

concurrency:
  group: factory-watchdog
  cancel-in-progress: false

permissions:
  contents: write
  actions: write
  issues: write
  pull-requests: write

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ secrets.FACTORY_TOKEN || github.token }}
      RUN_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5
        with:
          token: ${{ secrets.FACTORY_TOKEN || github.token }}
          fetch-depth: 0
      - run: bash .github/scripts/watchdog.sh
