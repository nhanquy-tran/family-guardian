name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Migration versions unique and newer than main
        if: github.event_name == 'pull_request'
        run: bash .github/scripts/check-migrations.sh
      - uses: ./.github/actions/setup
      # Same gates as `npm run check`, run side by side; each log is printed in full afterwards.
      - name: Typecheck, lint and test
        run: |
          npm run typecheck > typecheck.log 2>&1 & typecheck=$!
          npm run lint > lint.log 2>&1 & lint=$!
          npm run test > test.log 2>&1 & tests=$!
          status=0
          for step in typecheck lint tests; do
            pid=${!step}
            if wait "$pid"; then result=passed; else result=failed; status=1; fi
            log=$([ "$step" = tests ] && echo test.log || echo "$step.log")
            echo "::group::$step ($result)"; cat "$log"; echo "::endgroup::"
            [ "$result" = failed ] && echo "::error::$step failed"
          done
          exit $status

  # Runs next to `check` to cut wall time; both are required on main. The name avoids clashing with the
  # factory's matrix job `build (<issue>)`.
  ci-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
      - uses: actions/cache@v4
        with:
          path: apps/web/.next/cache
          key: next-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ hashFiles('apps/web/src/**', 'packages/shared/src/**') }}
          restore-keys: next-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-
      - run: npm run build

  secrets-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
