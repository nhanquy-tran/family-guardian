name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read # the destructive-migration guard reads the approval label

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
      - name: Typecheck, lint, tests with coverage minimums (ADR 0023)
        run: npm run check:ci
      - name: Source-of-truth specs valid
        run: npx openspec validate --specs --strict --no-interactive

  # Runs next to `check` to cut wall time; both are required on main. The name avoids clashing with the
  # factory's matrix job `build (<issue>)`.
  ci-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
      - uses: actions/cache@v4
        with:
          path: apps/web/.next/cache
          key: next-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ hashFiles('apps/web/src/**', 'packages/shared/src/**') }}
          restore-keys: next-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-
      - run: npm run build

  # Factory checks from nhanquy-tran/ai-factory: the spec gate on spec/* PRs, migration checks and the
  # wiring check (pack nextjs-supabase) on PRs and factory-dispatched runs.
  factory:
    uses: nhanquy-tran/ai-factory/.github/workflows/checks.yml@v1
    with:
      factory_ref: v1

  secrets-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
