name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Migration versions unique and newer than main
        if: github.event_name == 'pull_request'
        run: bash .github/scripts/check-migrations.sh
      - uses: ./.github/actions/setup
      - name: Typecheck, lint, tests with coverage minimums (ADR 0023)
        run: npm run check:ci
      - name: Coverage by area
        if: always() && hashFiles('coverage/coverage-summary.json') != ''
        run: |
          { echo "### Coverage by area"; echo; node .github/scripts/coverage-table.mjs; } >> "$GITHUB_STEP_SUMMARY"
          if ! git diff --quiet vitest.config.ts; then
            echo "::notice::Coverage rose above a minimum. Run npm run coverage and commit vitest.config.ts to raise it."
          fi
      - name: Source-of-truth specs valid
        run: npx openspec validate --specs --strict --no-interactive

  # Runs next to `check` to cut wall time; both are required on main. The name avoids clashing with the
  # factory's matrix job `build (<issue>)`.
  ci-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
      - uses: actions/cache@v4
        with:
          path: apps/web/.next/cache
          key: next-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ hashFiles('apps/web/src/**', 'packages/shared/src/**') }}
          restore-keys: next-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-
      - run: npm run build

  secrets-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
