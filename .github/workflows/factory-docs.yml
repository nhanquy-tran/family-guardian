name: "Factory 7: docs"

# Needs features.docs_job: true in .factory/config.yml. Applies the "Docs to update" notes of archived
# changes and opens one docs PR.
on:
  schedule:
    - cron: "47 2 * * *"
  workflow_dispatch:
    inputs:
      batch:
        description: Changes per run
        default: "5"

concurrency:
  group: factory-docs
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  docs:
    uses: nhanquy-tran/ai-factory/.github/workflows/docs.yml@v1
    with:
      batch: ${{ inputs.batch || '5' }}
      factory_ref: v1
    secrets: inherit
