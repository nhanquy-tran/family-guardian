name: "Factory 0: router"

# build-now -> build; needs-spec -> spec writer (only when features.spec_in_actions is on).
on:
  issues:
    types: [labeled]

permissions:
  actions: write
  contents: read
  issues: write

jobs:
  route:
    if: github.event.label.name == 'build-now' || github.event.label.name == 'needs-spec'
    uses: nhanquy-tran/ai-factory/.github/workflows/router.yml@v1
