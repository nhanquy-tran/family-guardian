name: "Factory 4: AI review"

on:
  workflow_dispatch:
    inputs:
      pr:
        description: PR number
        required: true
      risk:
        description: Risk tier from the build (normal or high)
        required: false
        default: normal
  pull_request:
    types: [opened, ready_for_review, labeled]

concurrency:
  group: review-${{ github.event.pull_request.number || inputs.pr }}
  cancel-in-progress: false

permissions:
  contents: read
  pull-requests: write
  issues: write
  statuses: write

jobs:
  review:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.actor == github.repository_owner && !github.event.pull_request.draft &&
       (github.event.action != 'labeled' || github.event.label.name == 're-review'))
    uses: nhanquy-tran/ai-factory/.github/workflows/review.yml@v1
    with:
      pr: ${{ format('{0}', github.event.pull_request.number || inputs.pr) }}
      risk: ${{ inputs.risk || 'normal' }}
      clear_rereview: ${{ github.event.action == 'labeled' }}
      factory_ref: v1
    secrets: inherit
