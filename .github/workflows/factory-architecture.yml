name: "Factory 9: architecture check"

# Needs features.architecture_check: true in .factory/config.yml. Weekly read-only look at the whole system,
# posted as one `architecture` issue.
on:
  schedule:
    - cron: "17 3 * * 1" # Monday, off :00/:30
  workflow_dispatch:
    inputs:
      days:
        description: Days of history for the facts
        default: "7"

concurrency:
  group: factory-architecture
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

jobs:
  check:
    uses: nhanquy-tran/ai-factory/.github/workflows/architecture.yml@v1
    with:
      days: ${{ inputs.days || '7' }}
      factory_ref: v1
    secrets: inherit
