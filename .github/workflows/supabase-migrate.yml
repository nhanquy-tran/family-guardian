name: Supabase migrations

# PRs that touch supabase/: dry run against the live project (shows what would be applied).
# Merge to main: apply pending migrations with `supabase db push`. See ADR 0011.

on:
  pull_request:
    paths: ["supabase/**", ".github/workflows/supabase-migrate.yml"]
  push:
    branches: [main]
    paths: ["supabase/**", ".github/workflows/supabase-migrate.yml"]
  workflow_dispatch:

concurrency:
  group: supabase-migrate
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF || 'gorggbnaidjszwhkzkzr' }}
    steps:
      - uses: actions/checkout@v5
      - uses: supabase/setup-cli@v3
        with:
          version: 3.2.0
      - name: Check secrets
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_DB_PASSWORD" ]; then
            echo "::error::Add repo secrets SUPABASE_ACCESS_TOKEN and SUPABASE_DB_PASSWORD (docs/human-setup.md, section 8)."
            exit 1
          fi
      - name: Prepare
        run: '[ -f supabase/config.toml ] || supabase init --yes'
      - name: Dry run
        if: github.event_name == 'pull_request'
        run: |
          set -o pipefail
          supabase db push --remote="$PROJECT_REF" --password "$SUPABASE_DB_PASSWORD" --dry-run | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Apply migrations
        if: github.event_name != 'pull_request'
        run: |
          set -o pipefail
          supabase db push --remote="$PROJECT_REF" --password "$SUPABASE_DB_PASSWORD" --yes | tee -a "$GITHUB_STEP_SUMMARY"
