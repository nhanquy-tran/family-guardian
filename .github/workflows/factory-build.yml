name: "Factory 3: build"

# Nightly (or on label `build-now`): take the oldest `ready` issues, write tests first (test-writer),
# implement (developer), run the gates, open a PR with evidence. A human merges (gate 2).

on:
  schedule:
    - cron: "0 15 * * *" # 22:00 Asia/Ho_Chi_Minh
  workflow_dispatch:
    inputs:
      issue:
        description: Issue number (empty = take the ready queue)
        required: false

concurrency:
  group: factory-build-${{ inputs.issue || 'queue' }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  select:
    runs-on: ubuntu-latest
    outputs:
      issues: ${{ steps.pick.outputs.issues }}
    env:
      GH_TOKEN: ${{ github.token }}
      INPUT_ISSUE: ${{ inputs.issue }}
      MAX: ${{ vars.FACTORY_MAX_PER_NIGHT || 3 }}
    steps:
      - id: pick
        run: |
          if [ -n "$INPUT_ISSUE" ]; then LIST="[$INPUT_ISSUE]"
          else
            LIST=$(gh issue list --repo "$GITHUB_REPOSITORY" --label ready --state open --limit 50 \
              --json number,createdAt | jq -c "sort_by(.createdAt) | map(.number) | .[:$MAX]")
          fi
          echo "issues=$LIST" >> "$GITHUB_OUTPUT"
          echo "Selected: $LIST"

  build:
    needs: select
    if: needs.select.outputs.issues != '[]' && needs.select.outputs.issues != ''
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      max-parallel: 1
      fail-fast: false
      matrix:
        issue: ${{ fromJson(needs.select.outputs.issues) }}
    env:
      ISSUE: ${{ matrix.issue }}
      GH_TOKEN: ${{ secrets.FACTORY_TOKEN || github.token }}
      MODEL: ${{ vars.FACTORY_BUILD_MODEL || 'claude-sonnet-5-5' }}
    steps:
      - uses: actions/checkout@v5
        with:
          token: ${{ secrets.FACTORY_TOKEN || github.token }}
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci && echo "$PWD/node_modules/.bin" >> "$GITHUB_PATH"

      - name: Find the approved change
        id: change
        run: |
          git config user.name "family-guardian-factory"
          git config user.email "factory@users.noreply.github.com"
          # The change folder is the one added by the spec commit for this issue ("spec: ... (#N)").
          # Searching proposal text is a fallback only: other proposals mention #N as a dependency.
          CHANGE=$(git log -E --grep "^spec: .*\(#${ISSUE}\)( \(#[0-9]+\))?$" --format= --name-only -- openspec/changes             | grep -oE '^openspec/changes/[^/]+' | grep -v '/archive$' | sed 's#.*/##' | sort | uniq -c | sort -rn | head -1 | awk '{print $2}' || true)
          if [ -z "$CHANGE" ]; then
            CHANGE=$(grep -rlE "^(Implements|Issue).*#${ISSUE}([^0-9]|$)" openspec/changes --include=proposal.md | grep -v /archive/ | head -1 | xargs -r dirname | xargs -r basename || true)
          fi
          echo "Change for #${ISSUE}: ${CHANGE:-none}"
          if [ -z "$CHANGE" ]; then
            gh issue comment "$ISSUE" --body "Factory: no approved OpenSpec change references #${ISSUE}. Label it \`needs-spec\` first."
            gh issue edit "$ISSUE" --remove-label ready --remove-label build-now --add-label needs-human
            exit 1
          fi
          echo "name=$CHANGE" >> "$GITHUB_OUTPUT"
          echo "started=$(date +%s)" >> "$GITHUB_OUTPUT"
          git checkout -b "factory/${ISSUE}"
          gh issue edit "$ISSUE" --remove-label ready --remove-label build-now --add-label in-progress

      - name: Test writer agent
        id: test_writer
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.CLAUDE_API_KEY }}
          allowed_bots: github-actions # the router dispatches as github-actions
          github_token: ${{ secrets.FACTORY_TOKEN || github.token }}
          prompt: |
            Follow .claude/agents/test-writer.md exactly.
            OpenSpec change: ${{ steps.change.outputs.name }}. Issue: #${{ matrix.issue }}.
          claude_args: |
            --model ${{ env.MODEL }}
            --max-turns 40
            --permission-mode default
            --allowedTools "Read,Write,Edit,Glob,Grep,Bash(npx vitest:*),Bash(npm run typecheck:*),Bash(npm test:*),Bash(ls:*)"

      - name: Metrics (test-writer)
        if: always()
        continue-on-error: true
        env:
          EXEC_FILE: ${{ steps.test_writer.outputs.execution_file }}
        run: bash .github/scripts/post-metrics.sh test-writer "$ISSUE" "$EXEC_FILE"

      - name: Commit tests
        id: tests
        run: |
          git checkout -B "factory/${ISSUE}"
          git add -A
          if git diff --cached --quiet; then echo "::error::Test writer produced no tests"; exit 1; fi
          git commit -m "test: scenarios for ${{ steps.change.outputs.name }} (#${ISSUE})"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          git diff --name-only HEAD~1 | grep -E '\.(test|spec)\.tsx?$' > /tmp/test-files.txt || true

      # Evals on the test-writer's commit, before the developer starts (the checker is not the producer).
      - name: "Eval: tests fail before implementation"
        id: red
        continue-on-error: true
        run: |
          FILES=$(tr '\n' ' ' < /tmp/test-files.txt)
          if [ -z "${FILES// }" ]; then R="fail (no unit test files)"
          elif npx vitest run $FILES > /tmp/red.log 2>&1; then R="fail (tests already pass without the implementation)"
          elif grep -qE "No test files found|SyntaxError|Transform failed" /tmp/red.log; then R="fail (tests do not run, see the run log)"; cat /tmp/red.log
          else R="pass (tests fail before implementation)"; fi
          echo "result=$R" >> "$GITHUB_OUTPUT"

      - name: "Eval: scenario coverage"
        id: coverage
        continue-on-error: true
        run: node .github/scripts/factory-eval.mjs coverage "${{ steps.change.outputs.name }}" $(cat /tmp/test-files.txt) > /tmp/evals.md

      - name: Developer agent
        id: developer
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.CLAUDE_API_KEY }}
          allowed_bots: github-actions # the router dispatches as github-actions
          github_token: ${{ secrets.FACTORY_TOKEN || github.token }}
          prompt: |
            Follow .claude/agents/developer.md exactly.
            OpenSpec change: ${{ steps.change.outputs.name }}. Issue: #${{ matrix.issue }}.
          claude_args: |
            --model ${{ env.MODEL }}
            --max-turns ${{ vars.FACTORY_DEV_MAX_TURNS || 80 }}
            --permission-mode default
            --allowedTools "Read,Write,Edit,Glob,Grep,Bash(npm run:*),Bash(npm test:*),Bash(npx vitest:*),Bash(npx openspec:*),Bash(npm install:*),Bash(ls:*),Bash(git status:*),Bash(git diff:*)"

      - name: Metrics (developer)
        if: always()
        continue-on-error: true
        env:
          EXEC_FILE: ${{ steps.developer.outputs.execution_file }}
        run: bash .github/scripts/post-metrics.sh developer "$ISSUE" "$EXEC_FILE"

      - name: "Gate: tests not weakened"
        id: guard
        if: always() && steps.tests.outcome == 'success'
        run: |
          git checkout -B "factory/${ISSUE}"
          git add -A
          CHANGED=""
          while read -r f; do
            [ -z "$f" ] && continue
            git diff --cached --quiet "${{ steps.tests.outputs.sha }}" -- "$f" || CHANGED="$CHANGED $f"
          done < /tmp/test-files.txt
          if [ -n "$CHANGED" ]; then echo "result=fail (changed:$CHANGED)" >> "$GITHUB_OUTPUT"; else echo "result=pass" >> "$GITHUB_OUTPUT"; fi

      - name: "Gate: check and build"
        id: gate
        if: always() && steps.tests.outcome == 'success'
        run: |
          if npm run check > /tmp/check.log 2>&1 && npm run build > /tmp/build.log 2>&1; then
            echo "result=pass" >> "$GITHUB_OUTPUT"
          else
            echo "result=fail" >> "$GITHUB_OUTPUT"
          fi
          tail -n 40 /tmp/check.log /tmp/build.log > /tmp/gate-tail.txt 2>/dev/null || true

      - name: "Eval: same tests pass after implementation"
        id: green
        if: always() && steps.tests.outcome == 'success'
        run: |
          FILES=$(tr '\n' ' ' < /tmp/test-files.txt)
          if [ -z "${FILES// }" ]; then R="fail (no unit test files)"
          elif npx vitest run $FILES > /tmp/green.log 2>&1; then R="pass"
          else R="fail (see the run log)"; tail -n 40 /tmp/green.log; fi
          echo "result=$R" >> "$GITHUB_OUTPUT"

      - name: Open PR with evidence
        if: always() && steps.tests.outcome == 'success'
        env:
          CHANGE: ${{ steps.change.outputs.name }}
          STARTED: ${{ steps.change.outputs.started }}
          TESTS_SHA: ${{ steps.tests.outputs.sha }}
          GUARD: ${{ steps.guard.outputs.result }}
          GATE: ${{ steps.gate.outputs.result }}
          RED: ${{ steps.red.outputs.result }}
          GREEN: ${{ steps.green.outputs.result }}
          COVERAGE: ${{ steps.coverage.outputs.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: bash .github/scripts/open-factory-pr.sh

      - name: Flag failure on the issue
        if: failure() && steps.tests.outcome != 'success' && steps.change.outputs.name != ''
        run: |
          gh issue comment "$ISSUE" --body "Factory run failed before tests were written: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          gh issue edit "$ISSUE" --remove-label in-progress --add-label needs-human
