name: "Factory 3: build"
run-name: "Factory 3: build ${{ inputs.issue && format('#{0}', inputs.issue) || 'queue' }}"

# Calls the shared build in nhanquy-tran/ai-factory. Keep the ref and factory_ref equal; bump both together.
on:
  schedule:
    - cron: "13 15 * * *" # 22:13 Asia/Ho_Chi_Minh, off the top of the hour
  workflow_dispatch:
    inputs:
      issue:
        description: Issue number (empty = take the ready queue)
        required: false

concurrency:
  group: factory-build-${{ inputs.issue || 'queue' }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: write

jobs:
  build:
    uses: nhanquy-tran/ai-factory/.github/workflows/build.yml@v1
    with:
      issue: ${{ inputs.issue }}
      factory_ref: v1
    secrets: inherit
