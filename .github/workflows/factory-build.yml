name: "Factory 3: build"
run-name: "Factory 3: build ${{ inputs.issue && format('#{0}', inputs.issue) || 'queue' }}"

# Nightly (or on label `build-now`): take the oldest `ready` issues, write tests first (test-writer),
# implement (developer), run the gates, open a PR with evidence. A human merges (gate 2).

on:
  schedule:
    - cron: "0 15 * * *" # 22:00 Asia/Ho_Chi_Minh
  workflow_dispatch:
    inputs:
      issue:
        description: Issue number (empty = take the ready queue)
        required: false

concurrency:
  group: factory-build-${{ inputs.issue || 'queue' }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  select:
    runs-on: ubuntu-latest
    outputs:
      issues: ${{ steps.pick.outputs.issues }}
    env:
      GH_TOKEN: ${{ github.token }}
      INPUT_ISSUE: ${{ inputs.issue }}
      MAX: ${{ vars.FACTORY_MAX_PER_NIGHT || 3 }}
    steps:
      - id: pick
        run: |
          if [ -n "$INPUT_ISSUE" ]; then LIST="[$INPUT_ISSUE]"
          else
            LIST=$(gh issue list --repo "$GITHUB_REPOSITORY" --label ready --state open --limit 50 \
              --json number,createdAt | jq -c "sort_by(.createdAt) | map(.number) | .[:$MAX]")
          fi
          echo "issues=$LIST" >> "$GITHUB_OUTPUT"
          echo "Selected: $LIST"

  build:
    needs: select
    if: needs.select.outputs.issues != '[]' && needs.select.outputs.issues != ''
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      max-parallel: 1
      fail-fast: false
      matrix:
        issue: ${{ fromJson(needs.select.outputs.issues) }}
    env:
      ISSUE: ${{ matrix.issue }}
      GH_TOKEN: ${{ secrets.FACTORY_TOKEN || github.token }}
      MODEL: ${{ vars.FACTORY_BUILD_MODEL || 'claude-sonnet-5-5' }}
    steps:
      - uses: actions/checkout@v5
        with:
          token: ${{ secrets.FACTORY_TOKEN || github.token }}
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci && echo "$PWD/node_modules/.bin" >> "$GITHUB_PATH"

      - name: Find the approved change
        id: change
        run: |
          git config user.name "family-guardian-factory"
          git config user.email "factory@users.noreply.github.com"
          # The change folder is the one added by the spec commit for this issue ("spec: ... (#N)").
          # Searching proposal text is a fallback only: other proposals mention #N as a dependency.
          CHANGE=$(git log -E --grep "^spec: .*\(#${ISSUE}\)( \(#[0-9]+\))?$" --format= --name-only -- openspec/changes             | grep -oE '^openspec/changes/[^/]+' | grep -v '/archive$' | sed 's#.*/##' | sort | uniq -c | sort -rn | head -1 | awk '{print $2}' || true)
          if [ -z "$CHANGE" ]; then
            CHANGE=$(grep -rlE "^(Implements|Issue).*#${ISSUE}([^0-9]|$)" openspec/changes --include=proposal.md | grep -v /archive/ | head -1 | xargs -r dirname | xargs -r basename || true)
          fi
          echo "Change for #${ISSUE}: ${CHANGE:-none}"
          if [ -z "$CHANGE" ]; then
            gh issue comment "$ISSUE" --body "Factory: no approved OpenSpec change references #${ISSUE}. Label it \`needs-spec\` first."
            gh issue edit "$ISSUE" --remove-label ready --remove-label build-now --add-label needs-human
            exit 1
          fi
          echo "name=$CHANGE" >> "$GITHUB_OUTPUT"
          echo "started=$(date +%s)" >> "$GITHUB_OUTPUT"
          git checkout -b "factory/${ISSUE}"
          gh issue edit "$ISSUE" --remove-label ready --remove-label build-now --add-label in-progress

      - name: Test writer agent
        id: test_writer
        # The gates below decide; a turn-cap or action error must not discard finished work.
        continue-on-error: true
        uses: anthropics/claude-code-action@v1
        env:
          GH_TOKEN: "" # agents get no repository token in their shell (ADR 0017)
        with:
          anthropic_api_key: ${{ secrets.CLAUDE_API_KEY }}
          allowed_bots: github-actions # the router and scheduler dispatch as github-actions
          github_token: ${{ github.token }}
          prompt: |
            Follow .claude/agents/test-writer.md exactly.
            OpenSpec change: ${{ steps.change.outputs.name }}. Issue: #${{ matrix.issue }}.
          claude_args: |
            --model ${{ env.MODEL }}
            --max-turns ${{ vars.FACTORY_TEST_MAX_TURNS || 45 }}
            --permission-mode default
            --allowedTools "Read,Write,Edit,Glob,Grep,Bash(npx vitest:*),Bash(npm run typecheck:*),Bash(npm test:*),Bash(ls:*),Bash(mkdir:*)"

      - name: Transcript (test-writer)
        if: always() && steps.test_writer.outputs.execution_file != ''
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: transcript-${{ matrix.issue }}-test-writer
          path: ${{ steps.test_writer.outputs.execution_file }}
          retention-days: 14

      - name: Metrics (test-writer)
        if: always()
        continue-on-error: true
        env:
          EXEC_FILE: ${{ steps.test_writer.outputs.execution_file }}
        run: bash .github/scripts/post-metrics.sh test-writer "$ISSUE" "$EXEC_FILE"

      # Hidden acceptance tests (Zühlke rule 2): checked to fail now, then removed from the tree
      # until after the build, so the developer never sees them.
      - name: Hide acceptance tests
        id: hidden_red
        run: |
          DIR="acceptance/${{ steps.change.outputs.name }}"
          if [ -d "$DIR" ] && ls "$DIR"/*.test.ts > /dev/null 2>&1; then
            if npx vitest run "$DIR" > /tmp/hidden-red.log 2>&1; then echo "result=fail (acceptance tests pass without the implementation)" >> "$GITHUB_OUTPUT"
            else echo "result=pass" >> "$GITHUB_OUTPUT"; fi
            mkdir -p /tmp/acceptance && cp -r "$DIR" /tmp/acceptance/ && rm -rf "$DIR"
            echo "count=$(ls /tmp/acceptance/${{ steps.change.outputs.name }}/*.test.ts | wc -l)" >> "$GITHUB_OUTPUT"
          else
            echo "result=fail (no acceptance tests written)" >> "$GITHUB_OUTPUT"; echo "count=0" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit tests
        id: tests
        run: |
          git checkout -B "factory/${ISSUE}"
          git add -A
          if git diff --cached --quiet; then echo "::error::Test writer produced no tests"; exit 1; fi
          git commit -m "test: scenarios for ${{ steps.change.outputs.name }} (#${ISSUE})"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          git diff --name-only HEAD~1 | grep -E '\.(test|spec)\.tsx?$' > /tmp/test-files.txt || true

      # Evals on the test-writer's commit, before the developer starts (the checker is not the producer).
      - name: "Eval: tests fail before implementation"
        id: red
        continue-on-error: true
        run: |
          FILES=$(tr '\n' ' ' < /tmp/test-files.txt)
          if [ -z "${FILES// }" ]; then R="fail (no unit test files)"
          elif npx vitest run $FILES > /tmp/red.log 2>&1; then R="fail (tests already pass without the implementation)"
          elif grep -qE "No test files found|SyntaxError|Transform failed" /tmp/red.log; then R="fail (tests do not run, see the run log)"; cat /tmp/red.log
          else R="pass (tests fail before implementation)"; fi
          echo "result=$R" >> "$GITHUB_OUTPUT"

      - name: "Eval: scenario coverage"
        id: coverage
        continue-on-error: true
        run: node .github/scripts/factory-eval.mjs coverage "${{ steps.change.outputs.name }}" $(cat /tmp/test-files.txt) > /tmp/evals.md

      # Enforced in tools, not prompts (A1/A2): the developer cannot edit tests, applied migrations,
      # the architecture doc or env files.
      - name: Developer guardrails
        id: guardrails
        run: |
          DENY="Edit(**/*.test.ts),Write(**/*.test.ts),Edit(**/*.test.tsx),Write(**/*.test.tsx),Edit(acceptance/**),Write(acceptance/**),Edit(docs/architecture.md),Edit(**/.env*),Write(**/.env*)"
          for f in supabase/migrations/*.sql; do DENY="$DENY,Edit($f),Write($f)"; done
          echo "deny=$DENY" >> "$GITHUB_OUTPUT"

      - name: Developer agent
        id: developer
        continue-on-error: true
        uses: anthropics/claude-code-action@v1
        env:
          GH_TOKEN: ""
        with:
          anthropic_api_key: ${{ secrets.CLAUDE_API_KEY }}
          allowed_bots: github-actions
          github_token: ${{ github.token }}
          prompt: |
            Follow .claude/agents/developer.md exactly.
            OpenSpec change: ${{ steps.change.outputs.name }}. Issue: #${{ matrix.issue }}.
            If a test looks wrong, STOP and write it under "## Test concerns" in NOTES.md; never work around a test in the code.
          claude_args: |
            --model ${{ env.MODEL }}
            --max-turns ${{ vars.FACTORY_DEV_MAX_TURNS || 70 }}
            --permission-mode default
            --allowedTools "Read,Write,Edit,Glob,Grep,Bash(npm run:*),Bash(npm test:*),Bash(npx vitest:*),Bash(npx openspec:*),Bash(npm install:*),Bash(ls:*),Bash(date:*),Bash(git status:*),Bash(git diff:*)"
            --disallowedTools "${{ steps.guardrails.outputs.deny }}"

      - name: Transcript (developer)
        if: always() && steps.developer.outputs.execution_file != ''
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: transcript-${{ matrix.issue }}-developer
          path: ${{ steps.developer.outputs.execution_file }}
          retention-days: 14

      - name: Metrics (developer)
        if: always()
        continue-on-error: true
        env:
          EXEC_FILE: ${{ steps.developer.outputs.execution_file }}
        run: bash .github/scripts/post-metrics.sh developer "$ISSUE" "$EXEC_FILE"

      # Deterministic node (A3): formatting and auto-fixable lint are code, not agent turns.
      - name: Lint auto-fix
        if: always() && steps.tests.outcome == 'success'
        continue-on-error: true
        run: (cd apps/web && npx eslint --fix . > /dev/null 2>&1) || true

      - name: "Gate: tests not weakened"
        id: guard
        if: always() && steps.tests.outcome == 'success'
        run: |
          git checkout -B "factory/${ISSUE}"
          git add -A
          CHANGED=""
          while read -r f; do
            [ -z "$f" ] && continue
            git diff --cached --quiet "${{ steps.tests.outputs.sha }}" -- "$f" || CHANGED="$CHANGED $f"
          done < /tmp/test-files.txt
          if [ -n "$CHANGED" ]; then echo "result=fail (changed:$CHANGED)" >> "$GITHUB_OUTPUT"; else echo "result=pass" >> "$GITHUB_OUTPUT"; fi

      - name: "Gate: check and build"
        id: gate
        if: always() && steps.tests.outcome == 'success'
        run: |
          if npm run check > /tmp/check.log 2>&1 && npm run build > /tmp/build.log 2>&1; then
            echo "result=pass" >> "$GITHUB_OUTPUT"
          else
            echo "result=fail" >> "$GITHUB_OUTPUT"
          fi
          tail -n 40 /tmp/check.log /tmp/build.log > /tmp/gate-tail.txt 2>/dev/null || true

      - name: "Eval: same tests pass after implementation"
        id: green
        if: always() && steps.tests.outcome == 'success'
        run: |
          FILES=$(tr '\n' ' ' < /tmp/test-files.txt)
          if [ -z "${FILES// }" ]; then R="fail (no unit test files)"
          elif npx vitest run $FILES > /tmp/green.log 2>&1; then R="pass"
          else R="fail (see the run log)"; tail -n 40 /tmp/green.log; fi
          echo "result=$R" >> "$GITHUB_OUTPUT"

      # Systematic debugging (2.4): when gates fail, root cause first; the debugger fixes code, or a
      # wrong test by the spec. Once per build; test changes are labelled for the gate.
      - name: Debugger agent
        id: debugger
        if: >-
          always() && steps.tests.outcome == 'success' && steps.guard.outputs.result == 'pass' &&
          (steps.green.outputs.result != 'pass' || steps.gate.outputs.result != 'pass')
        continue-on-error: true
        uses: anthropics/claude-code-action@v1
        env:
          GH_TOKEN: ""
        with:
          anthropic_api_key: ${{ secrets.CLAUDE_API_KEY }}
          allowed_bots: github-actions
          github_token: ${{ github.token }}
          prompt: |
            Follow .claude/agents/debugger.md exactly.
            OpenSpec change: ${{ steps.change.outputs.name }}. Issue: #${{ matrix.issue }}.
          claude_args: |
            --model ${{ env.MODEL }}
            --max-turns 40
            --permission-mode default
            --allowedTools "Read,Write,Edit,Glob,Grep,Bash(npx vitest:*),Bash(npm run:*),Bash(git diff:*),Bash(git log:*)"
            --disallowedTools "Edit(acceptance/**),Write(acceptance/**),Edit(docs/architecture.md)"

      - name: Transcript (debugger)
        if: always() && steps.debugger.outputs.execution_file != ''
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: transcript-${{ matrix.issue }}-debugger
          path: ${{ steps.debugger.outputs.execution_file }}
          retention-days: 14

      - name: Metrics (debugger)
        if: always() && steps.debugger.outcome != 'skipped'
        continue-on-error: true
        env:
          EXEC_FILE: ${{ steps.debugger.outputs.execution_file }}
        run: bash .github/scripts/post-metrics.sh debugger "$ISSUE" "$EXEC_FILE"

      - name: "Gates after debugging"
        id: regate
        if: always() && steps.debugger.outcome != 'skipped'
        run: |
          git checkout -B "factory/${ISSUE}"
          (cd apps/web && npx eslint --fix . > /dev/null 2>&1) || true
          git add -A
          CHANGED=""
          while read -r f; do
            [ -z "$f" ] && continue
            git diff --cached --quiet "${{ steps.tests.outputs.sha }}" -- "$f" || CHANGED="$CHANGED $f"
          done < /tmp/test-files.txt
          FILES=$(tr '\n' ' ' < /tmp/test-files.txt)
          if npx vitest run $FILES > /tmp/green.log 2>&1; then G="pass"; else G="fail (after debugging)"; tail -n 40 /tmp/green.log; fi
          if npm run check > /tmp/check.log 2>&1 && npm run build > /tmp/build.log 2>&1; then C="pass"; else C="fail (after debugging)"; fi
          tail -n 40 /tmp/check.log /tmp/build.log > /tmp/gate-tail.txt 2>/dev/null || true
          if [ -n "$CHANGED" ]; then echo "guard=arbitrated (debugger changed:$CHANGED)" >> "$GITHUB_OUTPUT"; else echo "guard=pass" >> "$GITHUB_OUTPUT"; fi
          echo "green=$G" >> "$GITHUB_OUTPUT"
          echo "gate=$C" >> "$GITHUB_OUTPUT"

      - name: "Gate: hidden acceptance tests"
        id: hidden
        if: always() && steps.tests.outcome == 'success'
        run: |
          CHANGE="${{ steps.change.outputs.name }}"
          if [ -d "/tmp/acceptance/$CHANGE" ]; then
            mkdir -p acceptance && cp -r "/tmp/acceptance/$CHANGE" acceptance/
            if npx vitest run "acceptance/$CHANGE" > /tmp/hidden.log 2>&1; then R="pass (${{ steps.hidden_red.outputs.count }} hidden tests)"
            else R="fail (hidden acceptance tests fail, see the run log)"; tail -n 40 /tmp/hidden.log; fi
          else R="fail (no acceptance tests)"; fi
          echo "result=$R" >> "$GITHUB_OUTPUT"

      # OpenSpec verify (1.2): completeness, correctness, coherence against the change and the specs.
      - name: Verifier agent
        id: verifier
        if: always() && steps.tests.outcome == 'success'
        continue-on-error: true
        uses: anthropics/claude-code-action@v1
        env:
          GH_TOKEN: ""
        with:
          anthropic_api_key: ${{ secrets.CLAUDE_API_KEY }}
          allowed_bots: github-actions
          github_token: ${{ github.token }}
          prompt: |
            Follow .claude/agents/verifier.md exactly.
            OpenSpec change: ${{ steps.change.outputs.name }}. Issue: #${{ matrix.issue }}.
            Write the result to openspec/changes/${{ steps.change.outputs.name }}/VERIFY.md (first line VERIFY: PASS or VERIFY: CRITICAL).
          claude_args: |
            --model ${{ env.MODEL }}
            --max-turns 30
            --permission-mode default
            --allowedTools "Read,Glob,Grep,Write(openspec/changes/**/VERIFY.md),Bash(npx openspec:*),Bash(openspec:*),Bash(git diff:*),Bash(git log:*)"

      - name: Transcript (verifier)
        if: always() && steps.verifier.outputs.execution_file != ''
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: transcript-${{ matrix.issue }}-verifier
          path: ${{ steps.verifier.outputs.execution_file }}
          retention-days: 14

      - name: Metrics (verifier)
        if: always() && steps.verifier.outcome != 'skipped'
        continue-on-error: true
        env:
          EXEC_FILE: ${{ steps.verifier.outputs.execution_file }}
        run: bash .github/scripts/post-metrics.sh verifier "$ISSUE" "$EXEC_FILE"

      # Archive (1.1): when every gate passes, the delta specs merge into openspec/specs in this PR,
      # so main always holds the source of truth for what is built.
      - name: Verify result and archive
        id: verify
        if: always() && steps.tests.outcome == 'success'
        run: |
          CHANGE="${{ steps.change.outputs.name }}"
          V="openspec/changes/$CHANGE/VERIFY.md"
          if [ -f "$V" ] && head -1 "$V" | grep -q "VERIFY: PASS"; then VR="pass"; elif [ -f "$V" ]; then VR="fail (critical findings, see VERIFY.md)"; else VR="fail (no verify report)"; fi
          echo "result=$VR" >> "$GITHUB_OUTPUT"
          cp "$V" /tmp/verify.md 2>/dev/null || true
          GUARD="${{ steps.regate.outputs.guard || steps.guard.outputs.result }}"; GATE="${{ steps.regate.outputs.gate || steps.gate.outputs.result }}"
          GREEN="${{ steps.regate.outputs.green || steps.green.outputs.result }}"; HIDDEN="${{ steps.hidden.outputs.result }}"
          AR="skipped (a gate did not pass)"
          if [[ "$VR" == pass* && "$GATE" == pass* && "$GREEN" == pass* && "$HIDDEN" == pass* && ( "$GUARD" == pass* || "$GUARD" == arbitrated* ) ]]; then
            if npx openspec archive "$CHANGE" -y > /tmp/archive.log 2>&1; then AR="pass (specs updated)"; else AR="fail (see the run log)"; cat /tmp/archive.log; fi
          fi
          echo "archive=$AR" >> "$GITHUB_OUTPUT"

      - name: Open PR with evidence
        if: always() && steps.tests.outcome == 'success'
        env:
          CHANGE: ${{ steps.change.outputs.name }}
          STARTED: ${{ steps.change.outputs.started }}
          TESTS_SHA: ${{ steps.tests.outputs.sha }}
          GUARD: ${{ steps.regate.outputs.guard || steps.guard.outputs.result }}
          GATE: ${{ steps.regate.outputs.gate || steps.gate.outputs.result }}
          RED: ${{ steps.red.outputs.result }}
          GREEN: ${{ steps.regate.outputs.green || steps.green.outputs.result }}
          COVERAGE: ${{ steps.coverage.outputs.result }}
          HIDDEN_RED: ${{ steps.hidden_red.outputs.result }}
          HIDDEN: ${{ steps.hidden.outputs.result }}
          VERIFY: ${{ steps.verify.outputs.result }}
          ARCHIVE: ${{ steps.verify.outputs.archive }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: bash .github/scripts/open-factory-pr.sh

      - name: Flag failure on the issue
        if: failure() && steps.tests.outcome != 'success' && steps.change.outputs.name != ''
        run: |
          gh issue comment "$ISSUE" --body "Factory run failed before tests were written: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          gh issue edit "$ISSUE" --remove-label in-progress --add-label needs-human
