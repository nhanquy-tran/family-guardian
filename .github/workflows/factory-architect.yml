name: "Factory 1: architect review"

on:
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: architect-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  architect:
    if: startsWith(github.head_ref, 'spec/') && github.actor == github.repository_owner
    uses: nhanquy-tran/ai-factory/.github/workflows/architect.yml@v1
    with:
      pr: ${{ format('{0}', github.event.pull_request.number) }}
      head_ref: ${{ github.head_ref }}
      base_sha: ${{ github.event.pull_request.base.sha }}
      factory_ref: v1
    secrets: inherit
