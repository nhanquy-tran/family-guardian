name: Claude on demand

# Needs features.claude_fixer: true in .factory/config.yml. An owner's @claude comment on an issue or PR
# starts the fixer (the watchdog also asks it to resolve conflicts when it is on).
on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

concurrency:
  group: claude-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  claude:
    if: contains(github.event.comment.body, '@claude') && github.event.comment.user.login == github.repository_owner
    uses: nhanquy-tran/ai-factory/.github/workflows/claude.yml@v1
    with:
      factory_ref: v1
    secrets: inherit
